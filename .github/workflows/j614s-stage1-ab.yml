name: J614s Stage1 A-B Handoff Candidates

on:
  push:
    branches:
      - j614s-one-shot-diagnostics
    paths:
      - '.github/workflows/j614s-stage1-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant:
          - upstream-release
          - j614s-release
          - j614s-debug
    steps:
      - name: Checkout Gravity diagnostic branch
        uses: actions/checkout@v4
      - name: Checkout exact upstream source
        uses: actions/checkout@v4
        with:
          repository: AsahiLinux/m1n1
          ref: 809541515659bf4e504807fd72bc0a539be5eee7
          submodules: recursive
          path: upstream-m1n1
      - name: Install pinned ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          rustup toolchain install 1.98.1 --profile minimal
          rustup +1.98.1 target add aarch64-unknown-none-softfloat
      - name: Apply J614s patch only to J614s candidates
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -eu
          test "$(git -C upstream-m1n1 rev-parse HEAD)" = 809541515659bf4e504807fd72bc0a539be5eee7
          if [ "$VARIANT" != upstream-release ]; then
            python3 tools/j614s/m1n1/patch-v1.9.9-j614s.py upstream-m1n1
            git -C upstream-m1n1 diff --check
          fi
          git -C upstream-m1n1 diff > /tmp/patch-applied.diff
      - name: Build raw stage1 and record checksums
        env:
          VARIANT: ${{ matrix.variant }}
          RUSTUP_TOOLCHAIN: 1.98.1
          M1N1_VERSION_TAG: v1.9.9-j614s-handoff-test
        run: |
          set -eu
          release=1
          [ "$VARIANT" != j614s-debug ] || release=0
          make -C upstream-m1n1 ARCH=aarch64-linux-gnu- RELEASE="$release" CHAINLOADING=1 -j2
          test -s upstream-m1n1/build/m1n1.bin
          grep -qx '#define CHAINLOADING' upstream-m1n1/build/build_cfg.h
          if [ "$release" = 1 ]; then
            grep -qx '#define RELEASE' upstream-m1n1/build/build_cfg.h
          else
            ! grep -qx '#define RELEASE' upstream-m1n1/build/build_cfg.h
          fi
          mkdir -p candidate
          cp upstream-m1n1/build/m1n1.bin candidate/m1n1.bin
          cp upstream-m1n1/build/build_cfg.h candidate/build_cfg.h
          cp /tmp/patch-applied.diff candidate/source.patch
          sha256sum candidate/m1n1.bin > candidate/SHA256SUMS
          wc -c candidate/m1n1.bin | tee candidate/BYTES.txt
          cat > candidate/README.txt <<'EOF'
          J614s diagnostic experiment: NOT VERIFIED ON TARGET.
          This artifact is a raw m1n1 stage1 candidate, not a signed IMG4.
          DO NOT overwrite Preboot files or run this directly as a Linux image.
          Re-enrollment of a custom kernelcache requires correct paired 1TR
          Recovery and owner authentication. Keep normal macOS untouched.
          Compare output hashes, firmware revision and runtime results before
          any decision to install a candidate. No installation is performed by CI.
          EOF
      - name: Upload uninstalled diagnostic candidate
        uses: actions/upload-artifact@v4
        with:
          name: j614s-stage1-${{ matrix.variant }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14
