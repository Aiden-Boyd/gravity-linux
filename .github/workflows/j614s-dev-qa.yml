name: J614s Dev Stack QA

on:
  push:
    branches:
      - m4-pro-j614s-dev-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential clang device-tree-compiler flex \
            libelf-dev libssl-dev lld llvm make python3-pip python3-setuptools
          python3 -m pip install --break-system-packages dtschema

      - name: Configure ARM64
        run: |
          make ARCH=arm64 LLVM=1 defconfig
          scripts/config --enable CONFIG_HID
          scripts/config --enable CONFIG_INPUT
          scripts/config --enable CONFIG_APPLE_DOCKCHANNEL
          scripts/config --enable CONFIG_APPLE_RTKIT_HELPER
          scripts/config --enable CONFIG_HID_DOCKCHANNEL
          scripts/config --enable CONFIG_MAILBOX
          scripts/config --enable CONFIG_APPLE_RTKIT
          scripts/config --enable CONFIG_APPLE_DOCKCHANNEL_MAILBOX
          scripts/config --enable CONFIG_APPLE_DOCKCHANNEL_HID
          scripts/config --enable CONFIG_MFD_MACSMC
          scripts/config --enable CONFIG_HWMON
          scripts/config --enable CONFIG_SENSORS_MACSMC_HWMON
          make ARCH=arm64 LLVM=1 olddefconfig
          for symbol in APPLE_DOCKCHANNEL_MAILBOX APPLE_DOCKCHANNEL_HID MFD_MACSMC SENSORS_MACSMC_HWMON; do
            grep -qx "CONFIG_${symbol}=y" .config || {
              echo "Required driver CONFIG_${symbol} was disabled by Kconfig"
              exit 1
            }
          done
          make ARCH=arm64 LLVM=1 prepare modules_prepare

      - name: Build J614s platform objects
        run: |
          make ARCH=arm64 LLVM=1 W=1 \
            drivers/soc/apple/mailbox.o \
            drivers/soc/apple/dockchannel.o \
            drivers/soc/apple/rtkit-helper.o \
            drivers/hid/dockchannel-hid/dockchannel-hid.o \
            drivers/mailbox/apple-dockchannel.o \
            drivers/hid/apple-dockchannel-hid/apple_dockchannel_hid.o \
            drivers/mfd/macsmc.o \
            drivers/hwmon/macsmc-hwmon.o

      - name: Build J614s DTBs
        run: |
          make ARCH=arm64 LLVM=1 W=1 \
            apple/t6040-j614s.dtb

      - name: Validate SMC binding
        run: |
          make dt_binding_check \
            DT_SCHEMA_FILES=Documentation/devicetree/bindings/mfd/apple,smc.yaml

      - name: Run DT schema checks
        run: |
          make ARCH=arm64 LLVM=1 CHECK_DTBS=y \
            apple/t6040-j614s.dtb

      - name: Check whitespace
        run: |
          git fetch origin gravity-m4:refs/remotes/origin/gravity-m4
          git diff --check origin/gravity-m4..m4-pro-j614s-dev
