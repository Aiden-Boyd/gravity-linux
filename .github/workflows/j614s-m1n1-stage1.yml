name: J614s m1n1 Stage1

on:
  workflow_dispatch:
  push:
    branches:
      - j614s-first-boot-v1
    paths:
      - .github/workflows/j614s-m1n1-stage1.yml
      - tools/j614s/m1n1/patch-v1.9.9-j614s.py

permissions:
  contents: write

jobs:
  build-stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Gravity branch
        uses: actions/checkout@v4
        with:
          path: gravity
          ref: j614s-first-boot-v1
          fetch-depth: 1

      - name: Checkout exact m1n1 v1.9.9
        uses: actions/checkout@v4
        with:
          repository: AsahiLinux/m1n1
          ref: 809541515659bf4e504807fd72bc0a539be5eee7
          submodules: recursive
          path: m1n1

      - name: Install pinned build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add --toolchain 1.98.1 aarch64-unknown-none-softfloat
          rustc --version | grep -q 'rustc 1.98.1'
          cargo --version | grep -q 'cargo 1.98.1'

      - name: Apply reviewed J614s patch set
        run: |
          test "$(git -C m1n1 rev-parse HEAD)" = "809541515659bf4e504807fd72bc0a539be5eee7"
          python3 gravity/tools/j614s/m1n1/patch-v1.9.9-j614s.py m1n1
          grep -q 'broken_wfi = true' m1n1/src/chickens.c
          grep -q 'dapf_skip_entry' m1n1/src/dapf.c
          grep -q 'LOGBUF_TOP_GUARD_SIZE' m1n1/src/kboot.c
          grep -q 'mcc,t6041' m1n1/src/mcc.c
          grep -q 't6040_features' m1n1/src/cpufreq.c
          grep -q 't6040_pcie_requested' m1n1/src/kboot.c
          grep -q 'T6040 disabled by target DT; leaving PCIe untouched' m1n1/src/kboot.c
          grep -q 'skipping unsupported T6040 init during J614s bring-up' m1n1/src/kboot.c
          grep -q 'APCIE_PHY_CTRL_RESET_T8132 BIT(4)' m1n1/src/pcie.c
          git -C m1n1 diff --check
          git -C m1n1 diff > m1n1-j614s-v1.9.9.diff

      - name: Build exact patched chainloading stage1 twice
        env:
          M1N1_VERSION_TAG: v1.9.9-j614s.4
        run: |
          make -C m1n1 -j2 ARCH=aarch64-linux-gnu- RELEASE=1 CHAINLOADING=1
          grep -qx '#define RELEASE' m1n1/build/build_cfg.h
          grep -qx '#define CHAINLOADING' m1n1/build/build_cfg.h
          cp m1n1/build/m1n1.bin /tmp/m1n1-stage1-first.bin

          make -C m1n1 clean
          make -C m1n1 -j2 ARCH=aarch64-linux-gnu- RELEASE=1 CHAINLOADING=1
          cmp /tmp/m1n1-stage1-first.bin m1n1/build/m1n1.bin

          SIZE="$(wc -c < m1n1/build/m1n1.bin | tr -d '[:space:]')"
          SHA="$(sha256sum m1n1/build/m1n1.bin | awk '{print $1}')"
          printf 'candidate-size=%s\ncandidate-sha256=%s\n' "$SIZE" "$SHA"
          printf '%s  %s\n' "$SHA" "m1n1.bin" | tee m1n1-stage1-v1.9.9-j614s.4.sha256
          strings m1n1/build/m1n1.bin | grep -Fq 'chosen.asahi,m1n1-stage1-version=v1.9.9-j614s.4'

      - name: Upload reproducible stage1 candidate
        uses: actions/upload-artifact@v4
        with:
          name: m1n1-stage1-v1.9.9-j614s.4-candidate
          path: |
            m1n1/build/m1n1.bin
            m1n1/build/build_cfg.h
            m1n1-stage1-v1.9.9-j614s.4.sha256
            m1n1-j614s-v1.9.9.diff
          if-no-files-found: error

      - name: Publish and repin reviewed stage1
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="29c9ac4542577e88e58734075d069835afac1a6b4db8b16b7aa7000942196411"
          EXPECTED_SIZE="3866624"
          ACTUAL_SHA="$(sha256sum m1n1/build/m1n1.bin | awk '{print $1}')"
          ACTUAL_SIZE="$(wc -c < m1n1/build/m1n1.bin | tr -d '[:space:]')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          strings m1n1/build/m1n1.bin | grep -Fq 'chosen.asahi,m1n1-stage1-version=v1.9.9-j614s.4'

          DEST="gravity/tools/j614s/m1n1/m1n1-v1.9.9-j614s.4-chainloading.bin"
          cp m1n1/build/m1n1.bin "$DEST"
          cp m1n1-stage1-v1.9.9-j614s.4.sha256 gravity/tools/j614s/m1n1/

          git -C gravity config user.name "github-actions[bot]"
          git -C gravity config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C gravity add tools/j614s/m1n1/m1n1-v1.9.9-j614s.4-chainloading.bin tools/j614s/m1n1/m1n1-stage1-v1.9.9-j614s.4.sha256
          git -C gravity commit -m "j614s: publish reproducible m1n1 stage1 v1.9.9-j614s.4"
          BIN_COMMIT="$(git -C gravity rev-parse HEAD)"

          export BIN_COMMIT EXPECTED_SHA EXPECTED_SIZE
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path("gravity/tools/j614s/installer/bootstrap.sh")
          s = p.read_text()
          replacements = {
              'EXPECTED_M1N1_VERSION="v1.9.9-j614s.1"':
                  'EXPECTED_M1N1_VERSION="v1.9.9-j614s.4"',
              'M1N1_STAGE1_REPO_COMMIT="a853472376b58b794637b43a9f34dc1ae76a7daa"':
                  f'M1N1_STAGE1_REPO_COMMIT="{os.environ["BIN_COMMIT"]}"',
              'tools/j614s/m1n1/m1n1-v1.9.9-j614s-chainloading.bin':
                  'tools/j614s/m1n1/m1n1-v1.9.9-j614s.4-chainloading.bin',
              'M1N1_STAGE1_SHA256="40e9510d539fb539f09c1b944ab3d1c23f2d7f8ed604e1c200bedf5564249499"':
                  f'M1N1_STAGE1_SHA256="{os.environ["EXPECTED_SHA"]}"',
              'M1N1_STAGE1_SIZE="3866624"':
                  f'M1N1_STAGE1_SIZE="{os.environ["EXPECTED_SIZE"]}"',
              '# Fail closed while the guarded .2 stage1 is being reproducibly rebuilt and\n# pinned. Read-only --probe/--deep-probe remain available.\nSTAGE1_REPIN_PENDING=1':
                  '# Reproducible guarded .4 stage1 is pinned to the exact publishing commit.\nSTAGE1_REPIN_PENDING=0',
              'fail "stage1 v1.9.9-j614s.2 repin is pending; normal install is intentionally blocked"':
                  'fail "stage1 repin is pending; normal install is intentionally blocked"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"missing bootstrap repin anchor: {old}")
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git -C gravity add tools/j614s/installer/bootstrap.sh
          git -C gravity commit -m "j614s: repin installer to m1n1 stage1 v1.9.9-j614s.4"
          git -C gravity push origin HEAD:j614s-first-boot-v1
