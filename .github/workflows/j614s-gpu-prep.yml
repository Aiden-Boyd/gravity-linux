name: J614s GPU Prep Audit

# Static-only: this workflow never touches J614s hardware.

on:
  push:
    branches:
      - j614s-gpu-prep-v1
    paths:
      - '.github/workflows/j614s-gpu-prep.yml'
      - 'tools/j614s/GPU_BRINGUP.md'
      - 'tools/j614s/gpu-audit.sh'
      - 'tools/j614s/t6040-gpu-evidence.json'
      - 'tools/j614s/m1n1/collect-gpu-adt.py'
      - 'tools/j614s/gpu_candidate_gate.py'
      - 'tools/j614s/gpu-candidate-contract.example.json'
      - 'tools/j614s/gpu-upstream-status-*.json'
      - 'tools/j614s/test_gpu_candidate_gate.py'
      - 'arch/arm64/boot/dts/apple/t6040*.dts'
      - 'arch/arm64/boot/dts/apple/t6040*.dtsi'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate GPU prep tooling and evidence
        run: |
          python3 -m py_compile \
            tools/j614s/m1n1/collect-gpu-adt.py \
            tools/j614s/gpu_candidate_gate.py \
            tools/j614s/test_gpu_candidate_gate.py
          PYTHONPATH=tools/j614s python3 -m unittest -v tools/j614s/test_gpu_candidate_gate.py
          sh -n tools/j614s/gpu-audit.sh
          sh tools/j614s/gpu-audit.sh

          python3 - <<'PY'
          import json

          path = "tools/j614s/t6040-gpu-evidence.json"
          d = json.load(open(path))

          assert d["status"] == "evidence-only"
          assert d["machine"] == {
              "model": "Mac16,8",
              "board": "J614s",
              "soc": "T6040",
              "gpu_generation": "G16",
          }
          assert d["safety"]["do_not_probe"] is True
          assert d["adt"]["sgx"]["compatible"] == "gpu,t6040"
          assert d["adt"]["gfx_asc"]["compatible"] == "iop,ascwrap-v6"

          delta = int(d["adt"]["address_translation"]["cpu_physical_delta"], 0)
          for block in ("sgx", "gfx_asc"):
              for reg in d["adt"][block]["registers"]:
                  raw = int(reg["adt_bus_base"], 0)
                  phys = int(reg["cpu_physical_base"], 0)
                  assert raw + delta == phys, (block, reg)

          assert d["adt"]["sgx"]["interrupts_raw_adt"] == [
              1481, 1482, 1483, 1484, 1505, 1507, 1496, 1498
          ]
          assert d["adt"]["gfx_asc"]["interrupts_raw_adt"] == [
              1502, 1501, 1504, 1503
          ]
          assert d["adt"]["gfx_asc"]["linux_mailbox_semantic_candidate"]["interrupts"] == [
              1501, 1502, 1503, 1504
          ]

          assert d["legacy_downstream_reference"]["m1n1"]["dt_set_gpu_supported_chips"][-1] == "T6022"
          assert "T6040" not in d["legacy_downstream_reference"]["m1n1"]["dt_set_gpu_supported_chips"]
          assert "apple,agx-t6040" not in d["legacy_downstream_reference"]["linux_driver"]["supported_of_compatibles"]

          u = json.load(open("tools/j614s/gpu-upstream-status-2026-10-07.json"))
          assert u["admission"] == "blocked"
          assert u["official_feature_status"]["t604x_gpu"] == "TBA"
          assert u["m1n1"]["t6040_g16_ready"] is False
          assert u["linux_gpu_branch"]["t6040_g16_ready"] is False
          assert u["mesa"]["t6040_g16_ready"] is False
          PY

          # The audit itself must recognize raw Apple ADT and Linux compatible
          # spellings, not only a gpu@ node name.
          grep -q 'gpu,t6040' tools/j614s/gpu-audit.sh
          grep -q 'apple,agx-t6040' tools/j614s/gpu-audit.sh

          # Behavioral guard tests: a fake native GPU node and an enabled
          # DRM_ASAHI config must both fail closed; the explicit developer
          # override is the only accepted bypass.
          audit_fixture="$(mktemp -d)"
          mkdir -p "$audit_fixture/drivers/gpu/drm" "$audit_fixture/arch/arm64/boot/dts/apple"
          printf 'VERSION = 7\nPATCHLEVEL = 1\nSUBLEVEL = 13\n' > "$audit_fixture/Makefile"
          printf '/ { soc { gpu@288000000 { compatible = "gpu,t6040"; }; }; };\n' \
            > "$audit_fixture/arch/arm64/boot/dts/apple/t6040-fixture.dtsi"
          if sh tools/j614s/gpu-audit.sh "$audit_fixture"; then
            echo "GPU audit unexpectedly accepted a fake T6040 node" >&2
            exit 1
          fi
          J614S_ALLOW_EXPERIMENTAL_GPU=1 sh tools/j614s/gpu-audit.sh "$audit_fixture"

          rm "$audit_fixture/arch/arm64/boot/dts/apple/t6040-fixture.dtsi"
          printf 'CONFIG_DRM_ASAHI=y\n' > "$audit_fixture/.config"
          if sh tools/j614s/gpu-audit.sh "$audit_fixture"; then
            echo "GPU audit unexpectedly accepted CONFIG_DRM_ASAHI=y" >&2
            exit 1
          fi
          rm -rf "$audit_fixture"

          grep -q 'ps_gpx: power-controller@0' arch/arm64/boot/dts/apple/t6040-pmgr.dtsi
          grep -q 'ps_afr: power-controller@100' arch/arm64/boot/dts/apple/t6040-pmgr.dtsi
          grep -q 'ps_gfx: power-controller@110' arch/arm64/boot/dts/apple/t6040-pmgr.dtsi

          # Evidence may exist under tools/, but the live Linux DT must stay
          # GPU-free until there is an explicit T6040/G16 driver contract.
          ! grep -R -E 'apple,agx-t6040|gpu,t6040' arch/arm64/boot/dts/apple/t6040*.dts arch/arm64/boot/dts/apple/t6040*.dtsi
