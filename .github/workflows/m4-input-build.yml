name: M4 MacBook Input Build

on:
  push:
    branches:
      - macbook-m4-input-qa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m4-input-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ARM64 build and DT validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential clang device-tree-compiler flex \
            libelf-dev libssl-dev lld llvm make python3-pip python3-setuptools
          python3 -m pip install --break-system-packages dtschema

      - name: Configure ARM64 kernel
        run: |
          make ARCH=arm64 LLVM=1 defconfig
          make ARCH=arm64 LLVM=1 prepare modules_prepare

      - name: Build affected driver objects
        run: |
          make ARCH=arm64 LLVM=1 W=1 \
            drivers/iommu/apple-dart.o \
            drivers/soc/apple/dockchannel.o \
            drivers/soc/apple/rtkit-helper.o \
            drivers/hid/dockchannel-hid/dockchannel-hid.o

      - name: Build J715 device tree
        run: |
          make ARCH=arm64 LLVM=1 W=1 \
            arch/arm64/boot/dts/apple/t8132-j715.dtb

      - name: Validate Apple DART binding
        run: |
          make dt_binding_check \
            DT_SCHEMA_FILES=Documentation/devicetree/bindings/iommu/apple,dart.yaml

      - name: Check patch series
        run: |
          git fetch origin gravity-m4:refs/remotes/origin/gravity-m4
          git format-patch --stdout origin/gravity-m4..macbook-m4-input-series-v2 | \
            ./scripts/checkpatch.pl --no-tree -

      - name: Check whitespace
        run: |
          git diff --check origin/gravity-m4..macbook-m4-input-series-v2
