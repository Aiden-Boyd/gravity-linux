name: J614s Installer QA

on:
  push:
    branches:
      - j614s-installer-v1-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Check local files
        run: |
          bash -n tools/j614s/installer/bootstrap.sh
          python3 -m py_compile tools/j614s/installer/patch_installer.py
          python3 -m py_compile tools/j614s/installer/probe_ipsw.py
          python3 -m py_compile tools/j614s/installer/probe_host.py
          python3 -m py_compile tools/j614s/installer/probe_local_layout.py
          python3 -m py_compile tools/j614s/installer/cleanup_partial.py
          python3 -m py_compile tools/j614s/installer/probe_aes_base_system.py
          python3 -m json.tool tools/j614s/installer/installer_data.json >/dev/null

      - name: Test host Recovery alignment logic
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("tools/j614s/installer/probe_host.py")
          spec = importlib.util.spec_from_file_location("probe_host", path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          good = {
              "macos_version": "26.6.2",
              "sfr_version": "26.6.2",
              "system_recovery_version": "26.6.2",
              "boot_mode": "macOS",
              "boot_vgid": "A",
              "default_boot_vgid": "A",
          }
          ready, reasons = mod.evaluate_alignment(good)
          assert ready is True
          assert reasons == []
          assert mod.evaluate_warnings(good) == []

          # Match the physical J614s observation: SystemRecovery can lag
          # behind macOS/SFR, and the packaged Asahi parser can return Unknown
          # for current bputil output. With matching boot/default VGIDs this is
          # warning-only, not a hard blocker.
          observed = dict(good)
          observed["system_recovery_version"] = "26.3"
          observed["boot_mode"] = "Unknown"
          ready, reasons = mod.evaluate_alignment(observed)
          assert ready is True
          assert reasons == []
          warnings = mod.evaluate_warnings(observed)
          assert any("SystemRecovery version differs" in warning for warning in warnings)
          assert any("bputil boot mode" in warning for warning in warnings)

          firmware_mismatch = dict(good)
          firmware_mismatch["sfr_version"] = "26.5"
          ready, reasons = mod.evaluate_alignment(firmware_mismatch)
          assert ready is False
          assert any("macOS/main firmware mismatch" in reason for reason in reasons)

          wrong_default = dict(good)
          wrong_default["default_boot_vgid"] = "B"
          ready, reasons = mod.evaluate_alignment(wrong_default)
          assert ready is False
          assert any("Default boot VGID".lower() in reason.lower() for reason in reasons)
          PY

      - name: Test guarded partial cleanup selection
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("tools/j614s/installer/cleanup_partial.py")
          spec = importlib.util.spec_from_file_location("cleanup_partial", path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          boot = {
              "ContainerReference": "disk3",
              "CapacityCeiling": 480_000_344_064,
              "PhysicalStores": [{"DeviceIdentifier": "disk0s2"}],
              "Volumes": [
                  {
                      "DeviceIdentifier": "disk3s5",
                      "Name": "Data",
                      "Roles": ["Data"],
                  }
              ],
          }
          stub = {
              "ContainerReference": "disk4",
              "CapacityCeiling": 2_499_805_184,
              "PhysicalStores": [{"DeviceIdentifier": "disk0s5"}],
              "Volumes": [
                  {
                      "DeviceIdentifier": "disk4s1",
                      "Name": "Gravity Linux J614s Dev - Data",
                      "Roles": ["Data"],
                  },
                  {
                      "DeviceIdentifier": "disk4s2",
                      "Name": "Gravity Linux J614s Dev",
                      "Roles": ["System"],
                  },
                  {
                      "DeviceIdentifier": "disk4s3",
                      "Name": "Preboot",
                      "Roles": ["Preboot"],
                  },
                  {
                      "DeviceIdentifier": "disk4s4",
                      "Name": "Recovery",
                      "Roles": ["Recovery"],
                  },
              ],
          }

          boot_ref, candidate = mod.find_candidate(
              {"Containers": [boot, stub]}, "disk3s5"
          )
          assert boot_ref == "disk3"
          assert candidate[0] == "disk4"
          assert candidate[1] == "disk0s5"

          bad = dict(stub)
          bad["CapacityCeiling"] = 20_000_000_000
          try:
              mod.find_candidate({"Containers": [boot, bad]}, "disk3s5")
          except RuntimeError:
              pass
          else:
              raise SystemExit("oversized non-stub container was not rejected")

          duplicate = dict(stub)
          duplicate["ContainerReference"] = "disk5"
          duplicate["PhysicalStores"] = [{"DeviceIdentifier": "disk0s6"}]
          try:
              mod.find_candidate(
                  {"Containers": [boot, stub, duplicate]}, "disk3s5"
              )
          except RuntimeError:
              pass
          else:
              raise SystemExit("ambiguous partial stub layout was not rejected")
          PY

      - name: Test read-only IPSW probe fixtures
        run: |
          python3 - <<'PY'
          import plistlib
          import zipfile

          def make(path, bless2):
              manifest = {
                  "BuildIdentities": [{
                      "ApBoardID": "0x04",
                      "ApChipID": "0x6040",
                      "Info": {
                          "DeviceClass": "j614sap",
                          "RestoreBehavior": "Erase",
                          "Variant": "macOS Customer",
                          "BuildNumber": "24B2083",
                      },
                      "Manifest": {
                          "BaseSystem": {
                              "Info": {"Path": "BaseSystem.dmg.aea"}
                          },
                          "SEP": {
                              "Info": {"Path": "Firmware/sep-firmware.img4"}
                          },
                      },
                  }]
              }
              sysver = {
                  "ProductVersion": "15.1",
                  "ProductBuildVersion": "24B2083",
              }

              with zipfile.ZipFile(path, "w") as zf:
                  for name, obj in [
                      ("BuildManifest.plist", manifest),
                      ("usr/standalone/bootcaches.plist", {"bless2": bless2}),
                      ("SystemVersion.plist", sysver),
                      ("RestoreVersion.plist", {"ProductVersion": "15.1"}),
                      ("PlatformSupport.plist", {"SupportedModelProperties": []}),
                  ]:
                      zf.writestr(name, plistlib.dumps(obj))

                  zf.writestr("BaseSystem.dmg.aea", b"fixture")
                  zf.writestr("Firmware/sep-firmware.img4", b"fixture")
                  zf.writestr(
                      "BootabilityBundle/Restore/Firmware/Bootability.dmg.trustcache",
                      b"fixture",
                  )
                  zf.writestr(
                      "BootabilityBundle/Restore/Bootability/BootabilityBrain.framework/fixture",
                      b"fixture",
                  )
                  zf.writestr(
                      "Firmware/Manifests/restore/macOS Customer/apticket.fixture.im4m",
                      b"fixture",
                  )

          common = {"SupportsExternalPrebootObjects": True}
          legacy = {
              **common,
              "RestoreBundlePath": "./Restore",
              "SupportsPairedRecovery": True,
          }
          paired = {
              **common,
              "SupportsPairedRecovery": True,
          }
          invalid = dict(common)

          make("/tmp/probe-legacy.ipsw", legacy)
          make("/tmp/probe-paired.ipsw", paired)
          make("/tmp/probe-invalid.ipsw", invalid)
          PY

          python3 tools/j614s/installer/probe_ipsw.py --json /tmp/probe-legacy.ipsw > /tmp/legacy.json
          python3 tools/j614s/installer/probe_ipsw.py --json /tmp/probe-paired.ipsw > /tmp/paired.json

          python3 - <<'PY'
          import json

          legacy = json.load(open("/tmp/legacy.json"))
          paired = json.load(open("/tmp/paired.json"))

          assert legacy["restore_strategy"] == "legacy-explicit"
          assert legacy["restore_bundle_path"] == "Restore"
          assert paired["restore_strategy"] == "paired-implicit"
          assert paired["restore_bundle_path"] == "restore"
          assert paired["base_system_aea"] is True
          assert paired["manifest_paths_checked"] == 1
          PY

          if python3 tools/j614s/installer/probe_ipsw.py /tmp/probe-invalid.ipsw; then
            echo "expected invalid restore metadata fixture to fail" >&2
            exit 1
          fi

      - name: Fetch reviewed Asahi installer source
        run: |
          git clone --depth=1 https://github.com/AsahiLinux/asahi-installer.git /tmp/asahi

      - name: Patch source-tree layout
        run: |
          cp -a /tmp/asahi /tmp/asahi-source
          python3 tools/j614s/installer/patch_installer.py /tmp/asahi-source
          python3 tools/j614s/installer/patch_installer.py /tmp/asahi-source
          python3 -m py_compile /tmp/asahi-source/src/main.py /tmp/asahi-source/src/stub.py

          python3 - <<'PY'
          from pathlib import Path

          main = Path("/tmp/asahi-source/src/main.py").read_text()
          stub = Path("/tmp/asahi-source/src/stub.py").read_text()

          for lineno, line in enumerate(stub.splitlines(), 1):
              if 'bless2["RestoreBundlePath"]' in line:
                  print(f"remaining direct RestoreBundlePath reference at {lineno}: {line}")

          checks = {
              "T6040 minimum": '0x6040: "15.1"' in main,
              "J614s device": '"j614sap": Device("15.1", True)' in main,
              "15.1 IPSW": 'IPSW("15.1"' in main,
              "AEA helper": "def copy_aea_compress" in stub,
              "paired helper": "def get_restore_bundle_relpath" in stub,
              "paired flag": "SupportsPairedRecovery" in stub,
              "implicit restore": 'relpath = "restore"' in stub,
              "legacy symlink guard": "if restore_path_explicit:" in stub,
              "legacy direct index removed": 'bless2["RestoreBundlePath"]' not in stub,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("generated source checks failed: " + ", ".join(failed))
          PY

      - name: Patch flattened release layout
        run: |
          mkdir -p /tmp/asahi-flat
          cp /tmp/asahi/src/main.py /tmp/asahi-flat/main.py
          cp /tmp/asahi/src/stub.py /tmp/asahi-flat/stub.py

          python3 tools/j614s/installer/patch_installer.py /tmp/asahi-flat
          python3 tools/j614s/installer/patch_installer.py /tmp/asahi-flat
          python3 -m py_compile /tmp/asahi-flat/main.py /tmp/asahi-flat/stub.py

          python3 - <<'PY'
          from pathlib import Path

          main = Path("/tmp/asahi-flat/main.py").read_text()
          stub = Path("/tmp/asahi-flat/stub.py").read_text()

          checks = {
              "T6040 minimum": '0x6040: "15.1"' in main,
              "AEA dispatch": 'base_system_src.endswith(".aea")' in stub,
              "paired helper": "def get_restore_bundle_relpath" in stub,
              "legacy direct index removed": 'bless2["RestoreBundlePath"]' not in stub,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("generated release checks failed: " + ", ".join(failed))
          PY

      - name: Probe real original J614s macOS 15.1 IPSW
        env:
          PYTHONPATH: /tmp/asahi/src
        run: |
          python3 tools/j614s/installer/probe_ipsw.py --json \
            https://updates.cdn-apple.com/2024FallFCS/fullrestores/072-12302/3786987A-AD94-4BFB-81B8-56D3841CA81B/UniversalMac_15.1_24B2083_Restore.ipsw \
            > /tmp/j614s-15.1.json

          python3 - <<'PY'
          import json

          result = json.load(open("/tmp/j614s-15.1.json"))
          assert result["product_version"] == "15.1"
          assert result["product_build"] == "24B2083"
          assert result["device_class"] == "j614sap"
          assert result["chip_id"] == "0x6040"
          assert result["board_id"] == "0x04"
          assert result["restore_strategy"] == "paired-implicit"
          assert result["restore_bundle_path"] == "restore"
          assert result["base_system_aea"] is True
          assert result["supports_paired_recovery"] is True
          assert result["supports_external_preboot_objects"] is True
          assert result["manifest_paths_checked"] > 0
          PY

      - name: Verify tethered-only profile
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("tools/j614s/installer/installer_data.json").read_text())
          assert list(data) == ["os_list"]
          assert len(data["os_list"]) == 1
          profile = data["os_list"][0]
          assert profile["expert"] is True
          assert profile["boot_object"] == "m1n1.bin"
          assert profile["supported_fw"] == ["15.1"]
          assert profile["partitions"] == []
          PY

      - name: Check whitespace
        run: git diff --check
