name: J614s Upstream Series QA

on:
  push:
    branches:
      - j614s-upstream-series-v1-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential clang device-tree-compiler flex \
            libelf-dev libssl-dev lld llvm make python3-pip python3-setuptools
          python3 -m pip install --break-system-packages dtschema

      - name: Configure ARM64
        run: |
          make ARCH=arm64 LLVM=1 defconfig
          scripts/config --disable CONFIG_ARM64_4K_PAGES
          scripts/config --enable CONFIG_ARM64_16K_PAGES
          scripts/config --enable CONFIG_MAILBOX
          scripts/config --enable CONFIG_APPLE_MAILBOX
          scripts/config --enable CONFIG_MFD_MACSMC
          scripts/config --enable CONFIG_PCIE_APPLE
          scripts/config --enable CONFIG_PINCTRL_APPLE_GPIO
          make ARCH=arm64 LLVM=1 olddefconfig
          for symbol in APPLE_MAILBOX MFD_MACSMC PCIE_APPLE PINCTRL_APPLE_GPIO; do
            grep -qx "CONFIG_${symbol}=y" .config || {
              echo "Required CONFIG_${symbol}=y missing"
              exit 1
            }
          done
          make ARCH=arm64 LLVM=1 prepare modules_prepare

      - name: Build touched platform objects
        run: |
          make ARCH=arm64 LLVM=1 W=1 \
            drivers/soc/apple/mailbox.o \
            drivers/mfd/macsmc.o \
            drivers/pci/controller/pcie-apple.o \
            drivers/pinctrl/pinctrl-apple-gpio.o

      - name: Build J614s DTB
        run: |
          make ARCH=arm64 LLVM=1 W=1 apple/t6040-j614s.dtb

      - name: Validate modified bindings
        run: |
          for schema in \
            Documentation/devicetree/bindings/arm/apple.yaml \
            Documentation/devicetree/bindings/arm/apple/apple,pmgr.yaml \
            Documentation/devicetree/bindings/interrupt-controller/apple,aic2.yaml \
            Documentation/devicetree/bindings/mailbox/apple,mailbox.yaml \
            Documentation/devicetree/bindings/mfd/apple,smc.yaml \
            Documentation/devicetree/bindings/pci/apple,pcie.yaml \
            Documentation/devicetree/bindings/pinctrl/apple,pinctrl.yaml \
            Documentation/devicetree/bindings/power/apple,pmgr-pwrstate.yaml \
            Documentation/devicetree/bindings/watchdog/apple,wdt.yaml
          do
            make dt_binding_check DT_SCHEMA_FILES="$schema"
          done

      - name: Check J614s DT schema
        run: |
          make ARCH=arm64 LLVM=1 CHECK_DTBS=y apple/t6040-j614s.dtb

      - name: Check whitespace
        run: |
          git fetch --depth=1 origin gravity-m4:refs/remotes/origin/gravity-m4
          git diff --check origin/gravity-m4..HEAD
