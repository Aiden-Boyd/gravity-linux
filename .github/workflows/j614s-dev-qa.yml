name: J614s Dev Stack QA

on:
  push:
    branches:
      - m4-pro-j614s-dev-qa
      - m4-pro-j614s-pcie-foundation
      - m4-pro-j614s-smc-foundation-v2
      - m4-pro-j614s-sd-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential clang device-tree-compiler flex \
            libelf-dev libssl-dev lld llvm make python3-pip python3-setuptools
          python3 -m pip install --break-system-packages dtschema

      - name: Configure ARM64
        run: |
          make ARCH=arm64 LLVM=1 defconfig
          scripts/config --enable CONFIG_HID
          scripts/config --enable CONFIG_INPUT
          scripts/config --enable CONFIG_APPLE_DOCKCHANNEL
          scripts/config --enable CONFIG_APPLE_RTKIT_HELPER
          scripts/config --enable CONFIG_HID_DOCKCHANNEL
          scripts/config --enable CONFIG_MAILBOX
          scripts/config --enable CONFIG_APPLE_MAILBOX
          scripts/config --enable CONFIG_APPLE_RTKIT
          scripts/config --enable CONFIG_APPLE_DOCKCHANNEL_MAILBOX
          scripts/config --enable CONFIG_APPLE_DOCKCHANNEL_HID
          scripts/config --enable CONFIG_MFD_MACSMC
          scripts/config --enable CONFIG_HWMON
          scripts/config --enable CONFIG_SENSORS_MACSMC_HWMON
          scripts/config --disable CONFIG_ARM64_4K_PAGES
          scripts/config --enable CONFIG_ARM64_16K_PAGES
          scripts/config --enable CONFIG_PCIE_APPLE
          scripts/config --enable CONFIG_PINCTRL_APPLE_GPIO
          scripts/config --enable CONFIG_MMC
          scripts/config --enable CONFIG_MMC_BLOCK
          scripts/config --enable CONFIG_MMC_SDHCI
          scripts/config --enable CONFIG_MMC_SDHCI_PCI
          make ARCH=arm64 LLVM=1 olddefconfig
          for symbol in APPLE_DOCKCHANNEL_MAILBOX APPLE_DOCKCHANNEL_HID MFD_MACSMC SENSORS_MACSMC_HWMON PCIE_APPLE PINCTRL_APPLE_GPIO MMC MMC_BLOCK MMC_SDHCI MMC_SDHCI_PCI; do
            grep -qx "CONFIG_${symbol}=y" .config || {
              echo "Required driver CONFIG_${symbol} was disabled by Kconfig"
              exit 1
            }
          done
          make ARCH=arm64 LLVM=1 prepare modules_prepare

      - name: Build J614s platform objects
        run: |
          make ARCH=arm64 LLVM=1 W=1 \
            drivers/soc/apple/mailbox.o \
            drivers/soc/apple/dockchannel.o \
            drivers/soc/apple/rtkit-helper.o \
            drivers/hid/dockchannel-hid/dockchannel-hid.o \
            drivers/mailbox/apple-dockchannel.o \
            drivers/hid/apple-dockchannel-hid/apple_dockchannel_hid.o \
            drivers/mfd/macsmc.o \
            drivers/hwmon/macsmc-hwmon.o \
            drivers/pci/controller/pcie-apple.o \
            drivers/pinctrl/pinctrl-apple-gpio.o \
            drivers/mmc/host/sdhci-pci-core.o \
            drivers/mmc/host/sdhci-pci-gli.o

      - name: Build J614s DTBs
        run: |
          make ARCH=arm64 LLVM=1 W=1 \
            apple/t6040-j614s.dtb \
            apple/t6040-j614s-sd.dtb

      - name: Validate J614s bindings
        run: |
          make dt_binding_check \
            DT_SCHEMA_FILES=Documentation/devicetree/bindings/mfd/apple,smc.yaml
          make dt_binding_check \
            DT_SCHEMA_FILES=Documentation/devicetree/bindings/pci/apple,pcie.yaml
          make dt_binding_check \
            DT_SCHEMA_FILES=Documentation/devicetree/bindings/pinctrl/apple,pinctrl.yaml

      - name: Run DT schema checks
        run: |
          make ARCH=arm64 LLVM=1 CHECK_DTBS=y \
            apple/t6040-j614s.dtb \
            apple/t6040-j614s-sd.dtb

      - name: Check whitespace
        run: |
          git fetch --depth=1 origin gravity-m4:refs/remotes/origin/gravity-m4
          git diff --check origin/gravity-m4..HEAD
