name: J614s Installer QA

on:
  push:
    branches:
      - j614s-installer-v1-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Check local files
        run: |
          bash -n tools/j614s/installer/bootstrap.sh
          python3 -m py_compile tools/j614s/installer/patch_installer.py
          python3 -m py_compile tools/j614s/installer/probe_ipsw.py
          python3 -m json.tool tools/j614s/installer/installer_data.json >/dev/null

      - name: Test read-only IPSW probe fixtures
        run: |
          python3 - <<'PY'
          import plistlib, zipfile
          from pathlib import Path

          def make(path, with_restore_path):
              ident = {
                  "ApBoardID": "0x04",
                  "ApChipID": "0x6040",
                  "Info": {
                      "DeviceClass": "j614sap",
                      "RestoreBehavior": "Erase",
                      "Variant": "macOS Customer",
                      "BuildNumber": "25F84",
                  },
                  "Manifest": {
                      "BaseSystem": {
                          "Info": {"Path": "BaseSystem.dmg.aea"}
                      }
                  },
              }
              bless2 = {"SomeTahoeKey": "value"}
              if with_restore_path:
                  bless2["RestoreBundlePath"] = "./restore"

              with zipfile.ZipFile(path, "w") as zf:
                  zf.writestr("BuildManifest.plist", plistlib.dumps({"BuildIdentities": [ident]}))
                  zf.writestr(
                      "usr/standalone/bootcaches.plist",
                      plistlib.dumps({"bless2": bless2}),
                  )
                  zf.writestr(
                      "SystemVersion.plist",
                      plistlib.dumps({
                          "ProductVersion": "26.5.2",
                          "ProductBuildVersion": "25F84",
                      }),
                  )
                  zf.writestr("BaseSystem.dmg.aea", b"fixture")

          make("/tmp/probe-pass.ipsw", True)
          make("/tmp/probe-fail.ipsw", False)
          PY

          python3 tools/j614s/installer/probe_ipsw.py /tmp/probe-pass.ipsw
          if python3 tools/j614s/installer/probe_ipsw.py /tmp/probe-fail.ipsw; then
            echo "expected missing RestoreBundlePath fixture to fail" >&2
            exit 1
          fi

      - name: Fetch reviewed Asahi installer source
        run: |
          git clone --depth=1 https://github.com/AsahiLinux/asahi-installer.git /tmp/asahi

      - name: Patch source-tree layout
        run: |
          cp -a /tmp/asahi /tmp/asahi-source
          python3 tools/j614s/installer/patch_installer.py /tmp/asahi-source
          python3 -m py_compile /tmp/asahi-source/src/main.py /tmp/asahi-source/src/stub.py
          grep -q '0x6040: "26.5.2"' /tmp/asahi-source/src/main.py
          grep -q '"j614sap": Device("26.5.2", True)' /tmp/asahi-source/src/main.py
          grep -q 'def copy_aea_compress' /tmp/asahi-source/src/stub.py

      - name: Patch flattened release layout
        run: |
          mkdir -p /tmp/asahi-flat
          cp /tmp/asahi/src/main.py /tmp/asahi-flat/main.py
          cp /tmp/asahi/src/stub.py /tmp/asahi-flat/stub.py
          python3 tools/j614s/installer/patch_installer.py /tmp/asahi-flat
          python3 -m py_compile /tmp/asahi-flat/main.py /tmp/asahi-flat/stub.py
          grep -q '0x6040: "26.5.2"' /tmp/asahi-flat/main.py
          grep -q 'base_system_src.endswith(".aea")' /tmp/asahi-flat/stub.py

      - name: Test read-only IPSW probe fixtures
        run: |
          python3 - <<'PY'
          import plistlib, zipfile
          from pathlib import Path

          def make(path, restore_path):
              manifest = {
                  "BuildIdentities": [{
                      "ApBoardID": "0x04",
                      "ApChipID": "0x6040",
                      "Info": {
                          "DeviceClass": "j614sap",
                          "RestoreBehavior": "Erase",
                          "Variant": "macOS Customer",
                          "BuildNumber": "25F84",
                      },
                      "Manifest": {
                          "BaseSystem": {"Info": {"Path": "arm64eBaseSystem.dmg.aea"}}
                      },
                  }]
              }
              bootcaches = {"bless2": {}}
              if restore_path is not None:
                  bootcaches["bless2"]["RestoreBundlePath"] = restore_path
              sysver = {"ProductVersion": "26.5.2", "ProductBuildVersion": "25F84"}

              with zipfile.ZipFile(path, "w") as zf:
                  for name, obj in [
                      ("BuildManifest.plist", manifest),
                      ("usr/standalone/bootcaches.plist", bootcaches),
                      ("SystemVersion.plist", sysver),
                  ]:
                      zf.writestr(name, plistlib.dumps(obj))
                  zf.writestr("arm64eBaseSystem.dmg.aea", b"fixture")

          make("/tmp/probe-pass.ipsw", "./Restore")
          make("/tmp/probe-fail.ipsw", None)
          PY

          python3 tools/j614s/installer/probe_ipsw.py /tmp/probe-pass.ipsw
          set +e
          python3 tools/j614s/installer/probe_ipsw.py /tmp/probe-fail.ipsw
          rc=$?
          set -e
          test "$rc" -eq 2

      - name: Verify tethered-only profile
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("tools/j614s/installer/installer_data.json").read_text())
          assert list(data) == ["os_list"]
          assert len(data["os_list"]) == 1
          profile = data["os_list"][0]
          assert profile["expert"] is True
          assert profile["boot_object"] == "m1n1.bin"
          assert profile["supported_fw"] == ["26.5.2"]
          assert profile["partitions"] == []
          PY

      - name: Check whitespace
        run: git diff --check
