name: J614s m1n1 Stage1

on:
  workflow_dispatch:
  push:
    branches:
      - j614s-first-boot-v1
    paths:
      - .github/workflows/j614s-m1n1-stage1.yml

permissions:
  contents: write

jobs:
  build-stage1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout m1n1 v1.9.9
        uses: actions/checkout@v4
        with:
          repository: AsahiLinux/m1n1
          ref: v1.9.9
          submodules: recursive
          path: m1n1

      - name: Install pinned build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add --toolchain 1.98.1 aarch64-unknown-none-softfloat
          rustc --version
          cargo --version
          rustc --version | grep -q 'rustc 1.98.1'
          cargo --version | grep -q 'cargo 1.98.1'

      - name: Build exact chainloading stage1 twice
        run: |
          test "$(git -C m1n1 rev-parse HEAD)" = "809541515659bf4e504807fd72bc0a539be5eee7"

          make -C m1n1 -k -j2 ARCH=aarch64-linux-gnu- RELEASE=1 CHAINLOADING=1
          grep -qx '#define RELEASE' m1n1/build/build_cfg.h
          grep -qx '#define CHAINLOADING' m1n1/build/build_cfg.h
          test -s m1n1/build/m1n1.bin
          strings m1n1/build/m1n1.bin | grep -q 'v1.9.9'
          cp m1n1/build/m1n1.bin /tmp/m1n1-stage1-first.bin

          make -C m1n1 clean
          make -C m1n1 -k -j2 ARCH=aarch64-linux-gnu- RELEASE=1 CHAINLOADING=1
          grep -qx '#define RELEASE' m1n1/build/build_cfg.h
          grep -qx '#define CHAINLOADING' m1n1/build/build_cfg.h
          cmp /tmp/m1n1-stage1-first.bin m1n1/build/m1n1.bin

          sha256sum m1n1/build/m1n1.bin | tee m1n1-stage1-v1.9.9.sha256

      - name: Upload exact chainloading stage1
        uses: actions/upload-artifact@v4
        with:
          name: m1n1-stage1-v1.9.9-chainloading
          path: |
            m1n1/build/m1n1.bin
            m1n1/build/build_cfg.h
            m1n1-stage1-v1.9.9.sha256
          if-no-files-found: error

      - name: Checkout Gravity branch for pinning
        uses: actions/checkout@v4
        with:
          path: gravity
          ref: j614s-first-boot-v1
          fetch-depth: 1

      - name: Commit verified stage1 binary
        run: |
          mkdir -p gravity/tools/j614s/m1n1
          cp m1n1/build/m1n1.bin gravity/tools/j614s/m1n1/m1n1-v1.9.9-chainloading.bin
          cp m1n1-stage1-v1.9.9.sha256 gravity/tools/j614s/m1n1/m1n1-v1.9.9-chainloading.sha256

          cd gravity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/j614s/m1n1/m1n1-v1.9.9-chainloading.bin \
                  tools/j614s/m1n1/m1n1-v1.9.9-chainloading.sha256

          if git diff --cached --quiet; then
            echo "Pinned stage1 already matches this exact build."
            exit 0
          fi

          git commit -m "tools: j614s: pin m1n1 v1.9.9 chainloading stage1"
          git push origin HEAD:j614s-first-boot-v1
